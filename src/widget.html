<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Codexage</title>
<style>
  :root {
    --bg: rgba(24, 22, 20, 0.86);
    --fg: #f3efe9;
    --muted: #a59d93;
    --track: rgba(255,255,255,0.10);
    --ok: #6cc58a;
    --warn: #e8b04a;
    --bad: #e5645a;
    --accent: #5b8def;
  }
  body.light {
    --bg: rgba(250, 248, 245, 0.94);
    --fg: #2b2723;
    --muted: #7a7168;
    --track: rgba(0,0,0,0.09);
    --ok: #2f8f55;
    --warn: #b97a0c;
    --bad: #c0392b;
  }
  body.light .card { border-color: rgba(0,0,0,0.08); box-shadow: 0 4px 18px rgba(0,0,0,0.15); }
  body.light .btn:hover { background: rgba(0,0,0,0.06); }
  body.light .pace { background: rgba(0,0,0,0.45); }
  body.light .bd { border-top-color: rgba(0,0,0,0.08); }
  body.light .seg + .seg { border-left-color: rgba(255,255,255,0.8); }
  body.ghost .card { opacity: .8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; }
  body {
    font: 12px/1.35 -apple-system, "Segoe UI", "Microsoft JhengHei UI", "PingFang TC", sans-serif;
    color: var(--fg);
    padding: 6px;
  }
  .card {
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 12px 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
  }
  header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; -webkit-app-region: drag; cursor: move; }
  .logo { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .title { font-weight: 600; letter-spacing: .2px; }
  .plan { color: var(--muted); font-size: 11px; }
  .spacer { flex: 1; }
  .btn {
    -webkit-app-region: no-drag;
    background: none; border: 0; color: var(--muted); cursor: pointer;
    width: 20px; height: 20px; border-radius: 5px; font-size: 13px; line-height: 20px;
  }
  .btn:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .row { margin-top: 7px; }
  .row:first-child { margin-top: 0; }
  .line { display: flex; align-items: baseline; gap: 6px; }
  .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.secondary .label { color: var(--muted); }
  .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--track); margin-top: 4px; overflow: visible; }
  .row.secondary .bar { height: 4px; }
  .fill { height: 100%; border-radius: 3px; transition: width .4s ease, background .4s; }
  .pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,.55); border-radius: 1px; }
  .reset { color: var(--muted); font-size: 10.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .eta { font-size: 10.5px; margin-top: 1px; }
  .eta.warn { color: var(--warn); }
  .eta.bad { color: var(--bad); font-weight: 600; }
  .eta.ok { color: var(--muted); opacity: .75; }
  .pct.money { font-weight: 500; font-size: 11px; }
  .compact .eta.ok { display: none; }

  .crow { display: flex; align-items: baseline; gap: 6px; font-size: 11px; margin-top: 3px; }
  .chead { color: var(--muted); font-size: 10.5px; margin-top: 0; margin-bottom: 4px; }
  .cname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cnum { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .chead .cnum { font-weight: 400; }
  .crow:not(.chead) .cnum:first-of-type { font-weight: 600; }
  .muted { color: var(--muted); }

  .acct { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
  body.light .acct { border-top-color: rgba(0,0,0,0.08); }
  .aname { font-size: 11px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aname.main { color: var(--fg); opacity: .85; margin-bottom: 6px; }
  .aplan { opacity: .8; }
  .mrow { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; }
  .mlabel { width: 92px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mbar { flex: 1; margin-top: 0; height: 4px; }
  .mpct { width: 32px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .mmsg { font-size: 11px; color: var(--muted); }
  .msub { font-size: 10px; color: var(--muted); margin: 1px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msub.warn { color: var(--warn); }
  .msub.bad { color: var(--bad); font-weight: 600; }
  .compact .msub:not(.bad) { display: none; }
  .alink { cursor: pointer; }
  .alink:hover { text-decoration: underline; }
  .mmsg a { color: var(--accent); -webkit-app-region: no-drag; }

  .bd { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
  .bdtitle { color: var(--muted); font-size: 10.5px; margin-bottom: 5px; }
  .stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--track); }
  .seg { height: 100%; min-width: 2px; }
  .seg + .seg { border-left: 1px solid rgba(0,0,0,0.35); }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px; font-size: 11px; }
  .lg { display: flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .lgname { color: var(--muted); }
  .lgpct { font-variant-numeric: tabular-nums; }

  .msg { color: var(--muted); padding: 2px 0 4px; }
  .msg b { color: var(--fg); font-weight: 600; }
  .action {
    -webkit-app-region: no-drag;
    margin-top: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font: inherit;
  }
  .action:hover { filter: brightness(1.1); }
  .action.alt { background: transparent; color: var(--muted); border: 1px solid var(--track); margin-left: 4px; }
  footer { display: flex; color: var(--muted); font-size: 10px; margin-top: 8px; }
  .err { color: var(--warn); }
  .note { color: var(--muted); font-size: 10.5px; margin-top: 6px; }
  .note.warnnote { color: var(--warn); }
  .note.badnote { color: var(--bad); font-weight: 600; margin: 0 0 6px; }
  .note a { color: var(--accent); -webkit-app-region: no-drag; }
  .row.reached .label::after { content: " ⛔"; }
  .compact header { margin-bottom: 6px; }
  .compact .reset { display: none; }
  .compact footer { display: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <header>
      <span class="logo"></span>
      <span class="title">Codex</span>
      <span class="plan" id="plan"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnHistory" data-i18n-title="w.history"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,10 4,6 7,8 11,2"/></svg></button>
      <button class="btn" id="btnRefresh" data-i18n-title="w.refresh">⟳</button>
      <button class="btn" id="btnSettings" data-i18n-title="w.settings">⚙</button>
      <button class="btn" id="btnHide" data-i18n-title="w.hide">✕</button>
    </header>
    <main id="content"></main>
    <footer><span id="updated"></span><span class="spacer"></span><span id="footErr" class="err"></span></footer>
  </div>
  <script src="widget.js"></script>
</body>
</html>
