# 推送到 main / 發 PR：三平台建置檢查（不發佈）
# 推送 v* 標籤（例如 v0.1.0）：三平台建置並上傳到 GitHub Release 草稿
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 有 package-lock.json 時用 npm ci，否則 npm install
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Syntax check
        shell: bash
        run: for f in src/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 尚未設定簽章：停用 macOS 自動尋找憑證
          # 之後加入簽章時，設定 secrets：CSC_LINK、CSC_KEY_PASSWORD、APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # 沒有憑證時 CSC_LINK 會是空字串，electron-builder 會把它當成專案資料夾去簽章 → 「not a file」
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder ${{ matrix.target }} --publish always
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: codexage-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
          retention-days: 7
